    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {

      height: 18px;

<body>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const profileCard = document.getElementById('profileCard');
const soccerIcon = document.getElementById('soccerIcon');

const W = 800, H = 600, C = 6; 
const cols = Math.floor(W / C), rows = Math.floor(H / C);

// 朱色の鳥居のSVGパスデータ
const toriiPaths = [
  'M 140 120 L 660 120 L 670 150 L 130 150 Z', 
  'M 180 210 L 620 210 L 620 240 L 180 240 Z', 
  'M 380 150 L 420 150 L 420 210 L 380 210 Z', 
  'M 240 150 L 280 150 L 260 520 L 220 520 Z', 
  'M 520 150 L 560 150 L 580 520 L 540 520 Z', 
  'M 200 520 L 280 520 L 290 550 L 190 550 Z', 
  'M 510 520 L 590 520 L 600 550 L 500 550 Z'  
];

let paths = toriiPaths.map(d => new Path2D(d));
let targets = [], settled = new Set(), cellColors = new Map(), falling = [], last = 0;
let toriiComplete = false;
let iconTriggered = false; // アイコン表示済みフラグ

// --- カラス & サッカーボールのアニメーション状態管理 ---
const groundY = 540;
const crow = {
  x: -80,
  y: -60,
  angle: 0,
  flightProgress: 0, 
  state: 'fly',      
  kickTimer: 0,
  animTime: 0
};

const ball = {
  x: 290,
  y: groundY - 12,
  vx: 0,
  vy: 0,
  rotation: 0,
  isKicked: false
};

// --- 舞い散る桜の花びら生成 ---
const petals = [];
const petalColors = ['#fecdd3', '#fda4af', '#f43f5e', '#ffe4e6'];
for (let i = 0; i < 35; i++) {
  petals.push({
    x: Math.random() * W,
    y: Math.random() * H,
    size: 4 + Math.random() * 5,
    speedY: 0.8 + Math.random() * 1.2,
    speedX: Math.random() * 0.8 - 0.4,
    angle: Math.random() * Math.PI * 2,
    spin: (Math.random() - 0.5) * 0.03,
    color: petalColors[Math.floor(Math.random() * petalColors.length)]
  });
}

function updateAndDrawPetals() {
  for (const p of petals) {
    p.y += p.speedY;
    p.x += Math.sin(p.angle) * 0.8 + p.speedX;
    p.angle += p.spin;

    if (p.y > H + 10) {
      p.y = -10;
      p.x = Math.random() * W;
    }

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = 0.7;
    
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(p.size / 2, -p.size / 2, p.size / 2, 0, Math.PI, true);
    ctx.lineTo(0, p.size);
    ctx.fill();
    ctx.restore();
  }
}

function insideMap(x, y) {
  return paths.some(p => ctx.isPointInPath(p, x, y));
}

function buildTargets() {
  targets = [];
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      let px = (x + 0.5) * C, py = (y + 0.5) * C;
      if (insideMap(px, py)) targets.push({ x, y, key: y * cols + x });
    }
  }
  targets.sort((a, b) => a.y - b.y || Math.random() - 0.5);
}

function spawn() {
  if (!targets.length) return;
  let amount = 1 + Math.floor(Math.random() * 4);
  let base = targets.shift();
  let cells = [base];

  for (let i = 1; i < amount; i++) {
    let options = targets.filter(t => Math.abs(t.x - base.x) <= 2 && Math.abs(t.y - base.y) <= 2);
    if (!options.length) break;
    let n = options[Math.floor(Math.random() * options.length)];
    targets.splice(targets.indexOf(n), 1);
    cells.push(n);
  }

  const palette = [
    '#fff1f2', '#ffe4e6', '#fecdd3', '#fda4af', '#fb7185', '#f43f5e', '#e11d48'
  ];

  falling.push({
    cells,
    x: cells[0].x * C,
    y: -Math.random() * 150 - 20,
    vy: 140 + Math.random() * 180,
    color: palette[Math.floor(Math.random() * palette.length)],
    delay: Math.random() * 0.15
  });
}

// --- カラス描画処理 ---
function drawCrow(dt) {
  crow.animTime += dt * 12;
  ctx.save();
  ctx.translate(crow.x, crow.y);

  let facingRight = Math.cos(crow.angle) >= 0;
  if (!facingRight && crow.state === 'fly') {
    ctx.scale(-1, 1);
  }

  ctx.fillStyle = '#1e293b';
  ctx.beginPath();
  ctx.ellipse(0, 0, 18, 12, -0.2, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(14, -8, 9, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#f59e0b';
  ctx.beginPath();
  ctx.moveTo(21, -10);
  ctx.lineTo(32, -6);
  ctx.lineTo(21, -3);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(16, -10, 2.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000000';
  ctx.beginPath();
  ctx.arc(17, -10, 1, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#0f172a';
  ctx.save();
  let wingAngle = crow.state === 'fly' ? Math.sin(crow.animTime * 2) * 0.7 : 0;
  ctx.rotate(wingAngle);
  ctx.beginPath();
  ctx.ellipse(-4, -4, 14, 7, -0.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 2;
  if (crow.state === 'kick') {
    ctx.beginPath();
    ctx.moveTo(2, 10);
    ctx.lineTo(14, 15);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-6, 10);
    ctx.lineTo(-6, 20);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(2, 10);
    ctx.lineTo(4, 18);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-2, 10);
    ctx.lineTo(-2, 18);
    ctx.stroke();
  }

  ctx.restore();
}

// --- サッカーボール描画処理 ---
function drawBall() {
  ctx.save();
  ctx.translate(ball.x, ball.y);
  ctx.rotate(ball.rotation);

  const r = 12;
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#0f172a';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#0f172a';
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.4, 0, Math.PI * 2);
  ctx.fill();

  for (let i = 0; i < 4; i++) {
    let a = (i * Math.PI) / 2;
    ctx.beginPath();
    ctx.arc(Math.cos(a) * r * 0.75, Math.sin(a) * r * 0.75, r * 0.25, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

// --- カラスの旋回軌道＆ボールキック動作の計算 ---
function updateCrowAndBall(dt) {
  if (!toriiComplete) return;

  if (crow.state === 'fly') {
    crow.flightProgress += dt * 0.35; 

    if (crow.flightProgress < 1) {
      let t = crow.flightProgress;

      let p0 = { x: -80, y: -60 };
      let p1 = { x: 500, y: 50 };
      let p2 = { x: 600, y: 350 };
      let p3 = { x: 100, y: 400 };
      let p4 = { x: ball.x - 22, y: groundY - 25 };

      let u = 1 - t;
      let prevX = crow.x;
      let prevY = crow.y;

      crow.x = Math.pow(u, 4) * p0.x + 
               4 * Math.pow(u, 3) * t * p1.x + 
               6 * Math.pow(u, 2) * Math.pow(t, 2) * p2.x + 
               4 * u * Math.pow(t, 3) * p3.x + 
               Math.pow(t, 4) * p4.x;

      crow.y = Math.pow(u, 4) * p0.y + 
               4 * Math.pow(u, 3) * t * p1.y + 
               6 * Math.pow(u, 2) * Math.pow(t, 2) * p2.y + 
               4 * u * Math.pow(t, 3) * p3.y + 
               Math.pow(t, 4) * p4.y;

      let dx = crow.x - prevX;
      let dy = crow.y - prevY;
      if (Math.abs(dx) > 0.1 || Math.abs(dy) > 0.1) {
        crow.angle = Math.atan2(dy, dx);
      }
    } else {
      crow.x = ball.x - 22;
      crow.y = groundY - 25;
      crow.angle = 0;
      crow.state = 'kick';
      crow.kickTimer = 0.25;

      ball.isKicked = true;
      ball.vx = 420;
      ball.vy = -280;
    }
  } else if (crow.state === 'kick') {
    crow.kickTimer -= dt;
    if (crow.kickTimer <= 0) {
      crow.state = 'idle';
    }
  }

  // ボールの物理挙動（放物線＆バウンド）
  if (ball.isKicked) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    ball.vy += 500 * dt;
    ball.rotation += 8 * dt;

    if (ball.y >= groundY - 12) {
      ball.y = groundY - 12;
      ball.vy = -ball.vy * 0.55;
      ball.vx *= 0.8;
      if (Math.abs(ball.vy) < 20) ball.vy = 0;
    }

    // ボールが画面外（右端 W=800 より先、または下部など）に完全に消えたかを判定
    if (!iconTriggered && ball.x > W + 30) {
      iconTriggered = true;
      soccerIcon.classList.add('visible');
    }
  }
}

function drawScene(dt) {
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  updateAndDrawPetals();

  for (const k of settled) {
    let x = k % cols, y = Math.floor(k / cols);
    ctx.fillStyle = cellColors.get(k) || '#fecdd3';
    ctx.fillRect(x * C + 0.5, y * C + 0.5, C - 1, C - 1);
  }

  for (const p of falling) {
    ctx.fillStyle = p.color;
    for (const c of p.cells) {
      let dx = (c.x - p.cells[0].x) * C, dy = (c.y - p.cells[0].y) * C;
      ctx.fillRect(p.x + dx + 0.5, p.y + dy + 0.5, C - 1, C - 1);
    }
  }

  if (toriiComplete) {
    drawBall();
    drawCrow(dt);
  }

  if (!toriiComplete && targets.length === 0 && falling.length === 0) {
    toriiComplete = true;
    profileCard.classList.add('visible');
  }
}

function loop(t) {
  let dt = Math.min((t - last) / 1000, 0.04);
  last = t;

  if (targets.length && falling.length < 45 && Math.random() < 0.95) {
    spawn();
  }

  for (let i = falling.length - 1; i >= 0; i--) {
    let p = falling[i];
    if (p.delay > 0) {
      p.delay -= dt;
      continue;
    }
    p.y += p.vy * dt;
    let dest = Math.max(...p.cells.map(c => c.y)) * C;

    if (p.y >= dest) {
      for (const c of p.cells) {
        settled.add(c.key);
        cellColors.set(c.key, p.color);
      }
      falling.splice(i, 1);
    }
  }

  updateCrowAndBall(dt);
  drawScene(dt);

  requestAnimationFrame(loop);
}

buildTargets();
last = performance.now();
requestAnimationFrame(loop);
</script>
