<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const profileCard = document.getElementById('profileCard');

const W = 800, H = 600, C = 6; 
const cols = Math.floor(W / C), rows = Math.floor(H / C);

// 朱色の鳥居（Torii）のSVGパスデータ
const toriiPaths = [
  'M 140 120 L 660 120 L 670 150 L 130 150 Z', // 笠木
  'M 180 210 L 620 210 L 620 240 L 180 240 Z', // 貫
  'M 380 150 L 420 150 L 420 210 L 380 210 Z', // 額束
  'M 240 150 L 280 150 L 260 520 L 220 520 Z', // 左柱
  'M 520 150 L 560 150 L 580 520 L 540 520 Z', // 右柱
  'M 200 520 L 280 520 L 290 550 L 190 550 Z', // 台石左
  'M 510 520 L 590 520 L 600 550 L 500 550 Z'  // 台石右
];

let paths = toriiPaths.map(d => new Path2D(d));
let targets = [], settled = new Set(), cellColors = new Map(), falling = [], last = 0;

// --- 舞い散る桜の花びら（パーティクル）生成 ---
const petals = [];
const petalColors = ['#fecdd3', '#fda4af', '#f43f5e', '#ffe4e6'];
for (let i = 0; i < 35; i++) {
  petals.push({
    x: Math.random() * W,
    y: Math.random() * H,
    size: 4 + Math.random() * 5,
    speedY: 0.8 + Math.random() * 1.2,
    speedX: Math.random() * 0.8 - 0.4,
    angle: Math.random() * Math.PI * 2,
    spin: (Math.random() - 0.5) * 0.03,
    color: petalColors[Math.floor(Math.random() * petalColors.length)]
  });
}

function updateAndDrawPetals() {
  for (const p of petals) {
    p.y += p.speedY;
    p.x += Math.sin(p.angle) * 0.8 + p.speedX;
    p.angle += p.spin;

    if (p.y > H + 10) {
      p.y = -10;
      p.x = Math.random() * W;
    }

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = 0.7;
    
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(p.size / 2, -p.size / 2, p.size / 2, 0, Math.PI, true);
    ctx.lineTo(0, p.size);
    ctx.fill();
    ctx.restore();
  }
}

function insideMap(x, y) {
  return paths.some(p => ctx.isPointInPath(p, x, y));
}

function buildTargets() {
  targets = [];
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      let px = (x + 0.5) * C, py = (y + 0.5) * C;
      if (insideMap(px, py)) targets.push({ x, y, key: y * cols + x });
    }
  }
  targets.sort((a, b) => a.y - b.y || Math.random() - 0.5);
}

function spawn() {
  if (!targets.length) return;
  let amount = 1 + Math.floor(Math.random() * 4);
  let base = targets.shift();
  let cells = [base];

  for (let i = 1; i < amount; i++) {
    let options = targets.filter(t => Math.abs(t.x - base.x) <= 2 && Math.abs(t.y - base.y) <= 2);
    if (!options.length) break;
    let n = options[Math.floor(Math.random() * options.length)];
    targets.splice(targets.indexOf(n), 1);
    cells.push(n);
  }

  const palette = [
    '#fff1f2', 
    '#ffe4e6', 
    '#fecdd3', 
    '#fda4af', 
    '#fb7185', 
    '#f43f5e', 
    '#e11d48'  
  ];

  falling.push({
    cells,
    x: cells[0].x * C,
    y: -Math.random() * 150 - 20,
    vy: 140 + Math.random() * 180,
    color: palette[Math.floor(Math.random() * palette.length)],
    delay: Math.random() * 0.15
  });
}

function drawScene() {
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  // 桜の花びらを描画
  updateAndDrawPetals();

  // 積み上がった鳥居ブロックを描画
  for (const k of settled) {
    let x = k % cols, y = Math.floor(k / cols);
    ctx.fillStyle = cellColors.get(k) || '#fecdd3';
    ctx.fillRect(x * C + 0.5, y * C + 0.5, C - 1, C - 1);
  }

  // 落下中のブロックを描画
  for (const p of falling) {
    ctx.fillStyle = p.color;
    for (const c of p.cells) {
      let dx = (c.x - p.cells[0].x) * C, dy = (c.y - p.cells[0].y) * C;
      ctx.fillRect(p.x + dx + 0.5, p.y + dy + 0.5, C - 1, C - 1);
    }
  }

  // ブロックの積み上がり率に応じてプロフィール表示
  const total = settled.size + targets.length + falling.reduce((a, p) => a + p.cells.length, 0);
  const progress = settled.size / Math.max(1, total);
  
  if (progress > 0.5) {
    profileCard.classList.add('visible');
  }
}

function loop(t) {
  let dt = Math.min((t - last) / 1000, 0.04);
  last = t;

  // ブロックが残っている場合のみ新しいブロックを発生させる
  if (targets.length && falling.length < 45 && Math.random() < 0.95) {
    spawn();
  }

  // 落下中ブロックの物理計算
  for (let i = falling.length - 1; i >= 0; i--) {
    let p = falling[i];
    if (p.delay > 0) {
      p.delay -= dt;
      continue;
    }
    p.y += p.vy * dt;
    let dest = Math.max(...p.cells.map(c => c.y)) * C;

    if (p.y >= dest) {
      for (const c of p.cells) {
        settled.add(c.key);
        cellColors.set(c.key, p.color);
      }
      falling.splice(i, 1);
    }
  }

  // 描画更新
  drawScene();

  // 単一のシンプルなループで永続実行（リセットせず鳥居は完成したまま静止）
  requestAnimationFrame(loop);
}

buildTargets();
last = performance.now();
requestAnimationFrame(loop);
</script>
